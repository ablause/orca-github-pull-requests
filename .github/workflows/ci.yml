name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Orca typings come from the Orca release the plugin is typed against
      - run: scripts/orca-types.sh .
        env:
          ORCA_VERSION: 1.4.272
      - run: npm run check
